<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>表白墙</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui}
body{background:#fff0f6;padding:20px;max-width:700px;margin:0 auto}
h1{text-align:center;color:#c2185b;margin-bottom:24px}
.box{background:#fff;border-radius:12px;padding:18px;margin-bottom:20px;box-shadow:0 2px 8px #0001}
input,textarea{width:100%;padding:12px;border:1px solid #f0b8cc;border-radius:8px;margin:8px 0;font-size:16px}
button{width:100%;padding:12px;background:#ec407a;color:white;border:none;border-radius:8px;font-size:17px}
.item{padding:14px;border-bottom:1px solid #fce4ec}
.name{font-weight:bold;color:#ad1457}
.time{font-size:12px;color:#999;margin-top:4px}
</style>
</head>
<body>
<h1>💌 表白墙</h1>
<div class="box">
    <input type="text" id="name" placeholder="你的昵称">
    <textarea id="txt" rows="5" placeholder="写下你的心里话..."></textarea>
    <button onclick="send()">提交留言</button>
</div>
<div class="box" id="list"></div>

<script>
async function load(){
    let res=await fetch("/api/get");
    let arr=await res.json();
    let dom=document.getElementById("list");
    dom.innerHTML="";
    arr.forEach(m=>{
        dom.innerHTML+=`
        <div class="item">
            <div class="name">${m.name}</div>
            <div>${m.content}</div>
            <div class="time">${m.time}</div>
        </div>
        `
    })
}
async function send(){
    let name=document.getElementById("name").value.trim();
    let content=document.getElementById("txt").value.trim();
    if(!name||!content)return alert("昵称和内容不能为空");
    await fetch("/api/add",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({name,content})
    })
    document.getElementById("txt").value="";
    load();
}
load();
</script>
</body>
</html>
